<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>知識世界</title>
<meta name="description" content="像素冒險學習站：地球永續國學淨零碳、AI 智能國學 AI，一區一區讀筆記、做小檢查、過試煉解鎖新區域。">
<link rel="canonical" href="https://jerry08100.github.io/ai-learning/">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="world.css?v=119">
<style>
  /* 世界地圖：地圖蓋滿視窗不捲動，標題與國名牌浮在上面 */
  html, body { height:100%; overflow:hidden; background:#0a1028; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; overflow:hidden; }
  #mapwrap { position:relative; flex:none; transition:transform .65s cubic-bezier(.6,0,.8,.4), filter .65s ease-in;
             -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent), linear-gradient(transparent,#000 6%,#000 94%,transparent);
             -webkit-mask-composite:source-in; mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent), linear-gradient(transparent,#000 6%,#000 94%,transparent); mask-composite:intersect; }
  #cv { width:100%; height:100%; cursor:default; }
  .glow { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:0; transition:opacity .25s;
          filter:drop-shadow(0 0 3px rgba(255,214,140,.9)) drop-shadow(0 0 10px rgba(255,200,120,.6)); z-index:3; }
  .glow.on { opacity:1; }
  .ctag { position:absolute; z-index:5; transform:translate(-50%,-50%); min-width:min(210px,44vw); min-height:44px; padding:12px 26px 10px; cursor:pointer;
          font-family:var(--f-pixel); color:var(--w); text-align:center; transition:transform .2s, box-shadow .2s; }
  .ctag b { display:block; font-weight:400; font-size:clamp(22px,2.4vw,34px); letter-spacing:3px; line-height:1.25; color:var(--w); }
  .ctag .pg { display:block; font-size:14px; color:var(--muted); margin-top:4px; letter-spacing:1px; white-space:nowrap; }
  .ctag.on, .ctag:hover, .ctag:focus-visible { transform:translate(-50%,-50%) translateY(-3px); box-shadow:inset 0 0 0 4px rgba(12,14,32,.9), inset 0 0 0 5px var(--gold), 0 0 26px rgba(232,200,119,.45); }
  .ctag.on b, .ctag:hover b { color:var(--y); }
  .title { position:fixed; z-index:6; left:max(16px, env(safe-area-inset-left)); top:max(14px, env(safe-area-inset-top)); padding:10px 20px 9px; }
  .title h1 { margin:0; font-family:var(--f-pixel); font-weight:400; font-size:clamp(20px,2vw,28px); letter-spacing:4px; color:var(--y);
              text-shadow:0 0 14px rgba(232,200,119,.35), 0 2px 0 #3a2a10; line-height:1.3; }
  .title p { margin:2px 0 0; font-size:14px; color:var(--muted); font-family:var(--f-pixel); letter-spacing:1px; }
  .veil { position:fixed; inset:0; z-index:9; background:#070914; opacity:0; pointer-events:none; transition:opacity .5s ease-in .15s; }
  body.going #mapwrap { transform:scale(2.6); filter:blur(1.5px) brightness(1.2); }
  body.going .veil { opacity:1; }
  body.going .ctag, body.going .title { opacity:0; transition:opacity .2s; }
  /* 同步設定（v119，使用者：系統設定放在一開始的頁面）：右上角按鈕＋原生 dialog；碼存在題庫練習同一份 ipas_quiz_progress */
  .setbtn { position:fixed; z-index:6; right:max(16px, env(safe-area-inset-right)); top:max(14px, env(safe-area-inset-top)); min-height:44px; padding:10px 18px 9px; cursor:pointer;
            font-family:var(--f-pixel); font-size:16px; letter-spacing:1px; color:var(--w); }
  .setbtn:hover, .setbtn:focus-visible { color:var(--y); }
  #setdlg { width:min(480px, calc(100vw - 32px)); padding:22px 24px; color:var(--w); font-size:16px; line-height:1.7; }
  #setdlg::backdrop { background:rgba(4,6,16,.7); }
  #setdlg h2 { margin:0 0 10px; font-family:var(--f-pixel); font-weight:400; font-size:22px; color:var(--y); letter-spacing:2px; }
  #setdlg p { margin:0 0 12px; color:var(--muted); font-size:15px; }
  #setdlg .code { margin:0 0 16px; font-size:24px; letter-spacing:1px; color:var(--w); user-select:all; }
  #setdlg label { display:block; margin-bottom:6px; }
  #setdlg input { width:100%; box-sizing:border-box; min-height:44px; padding:8px 12px; font-size:18px; background:#0b0e22; color:var(--w); border:1px solid var(--gold); }
  #setdlg .row { display:flex; gap:10px; margin-top:12px; } #setdlg .row button { flex:1; min-height:44px; cursor:pointer; font-size:17px; }
  #setdlg .lite { background:transparent; color:var(--w); border:1px solid var(--gold); font-family:var(--f-pixel); }
  #setmsg { min-height:1.7em; margin:10px 0 0; font-size:15px; }
  body.going .setbtn { opacity:0; transition:opacity .2s; }
</style>
</head>
<body>
<div class="stage">
  <div id="mapwrap">
    <canvas id="cv" aria-hidden="true"></canvas>
    <canvas class="glow" id="glow-earth" aria-hidden="true"></canvas>
    <canvas class="glow" id="glow-ai" aria-hidden="true"></canvas>
    <button class="ctag win" id="tag-earth" aria-label="進入地球永續國（淨零碳）"><b>地球永續國</b><span class="pg">TERRA</span></button>
    <button class="ctag win" id="tag-ai" aria-label="進入 AI 智能國（AI 應用規劃師）"><b>AI 智能國</b><span class="pg">NOVA</span></button>
  </div>
</div>
<header class="title win"><h1>知識世界</h1><p>選一個國家開始冒險</p></header>
<button class="setbtn win" id="setopen">同步設定</button>
<dialog id="setdlg" class="win" aria-labelledby="set-h">
  <h2 id="set-h">同步設定</h2>
  <p>手機和電腦用同一組同步碼，題庫練習與兩國地圖的進度就會跨裝置同步。</p>
  <div>這台的同步碼</div>
  <p class="code" id="setcode"></p>
  <label for="setin">換成另一台的同步碼</label>
  <p>套用後，這台題庫練習的紀錄會換成雲端那份；地圖進度則會兩邊合併。</p>
  <input id="setin" placeholder="例如 fox-river-8210" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p id="setmsg" role="status"></p>
  <div class="row"><button class="pbtn" id="setapply">套用</button><button class="lite" id="setclose">關閉</button></div>
</dialog>
<script>
(() => { // 同步碼跟題庫練習共用 localStorage ipas_quiz_progress；套用時把 updatedAt 歸零，進題庫時一定採用雲端那份（同 app.js #code-set）
  const K = 'ipas_quiz_progress', $ = (s) => document.getElementById(s), dlg = $('setdlg');
  const get = () => { try { return JSON.parse(localStorage.getItem(K)); } catch { return null; } };
  const show = () => { const st = get(); $('setcode').textContent = st?.syncCode || '還沒有（進一次題庫練習會自動產生，或在下面輸入另一台的碼）'; };
  $('setopen').onclick = () => { show(); $('setmsg').textContent = ''; $('setin').value = ''; dlg.showModal(); };
  $('setclose').onclick = () => dlg.close();
  $('setapply').onclick = () => {
    const v = $('setin').value.trim().toLowerCase();
    if (!/^[a-z]+-[a-z]+-\d{2,4}$/.test(v)) { $('setmsg').textContent = '格式是「英文-英文-數字」，例如 fox-river-8210（在另一台的同步設定或題庫「設定」頁看得到完整的碼）'; return; }
    const st = get() || { v: 1, q: {}, recent: [] }; st.syncCode = v; st.updatedAt = 0; delete st.codeFresh;
    try { localStorage.setItem(K, JSON.stringify(st)); } catch { $('setmsg').textContent = '存不進這台瀏覽器（可能是無痕模式）'; return; }
    show(); $('setin').value = ''; $('setmsg').textContent = '已套用。進國家地圖或題庫練習時會自動從雲端拉進度。';
  };
})();
</script>
<div class="veil" aria-hidden="true"></div>
<script type="module" src="worldmap.js?v=119"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
