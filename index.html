<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>知識世界</title>
<meta name="description" content="像素冒險學習站：地球永續國學淨零碳、AI 智能國學 AI，一區一區讀筆記、做小檢查、過試煉解鎖新區域。">
<link rel="canonical" href="https://jerry08100.github.io/ai-learning/">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="world.css">
<style>
  /* 世界地圖：地圖蓋滿視窗不捲動，標題與國名牌浮在上面 */
  html, body { height:100%; overflow:hidden; background:#0a1028; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; overflow:hidden; }
  #mapwrap { position:relative; flex:none; transition:transform .65s cubic-bezier(.6,0,.8,.4), filter .65s ease-in;
             -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent), linear-gradient(transparent,#000 6%,#000 94%,transparent);
             -webkit-mask-composite:source-in; mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent), linear-gradient(transparent,#000 6%,#000 94%,transparent); mask-composite:intersect; }
  #cv { width:100%; height:100%; cursor:default; }
  .glow { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:0; transition:opacity .25s;
          filter:drop-shadow(0 0 3px rgba(255,214,140,.9)) drop-shadow(0 0 10px rgba(255,200,120,.6)); z-index:3; }
  .glow.on { opacity:1; }
  .ctag { position:absolute; z-index:5; transform:translate(-50%,-50%); min-width:min(210px,44vw); min-height:44px; padding:12px 26px 10px; cursor:pointer;
          font-family:var(--f-pixel); color:var(--w); text-align:center; transition:transform .2s, box-shadow .2s; }
  .ctag b { display:block; font-weight:400; font-size:clamp(22px,2.4vw,34px); letter-spacing:3px; line-height:1.25; color:var(--w); }
  .ctag .pg { display:block; font-size:14px; color:var(--muted); margin-top:4px; letter-spacing:1px; }
  .ctag.on, .ctag:hover, .ctag:focus-visible { transform:translate(-50%,-50%) translateY(-3px); box-shadow:inset 0 0 0 4px rgba(12,14,32,.9), inset 0 0 0 5px var(--gold), 0 0 26px rgba(232,200,119,.45); }
  .ctag.on b, .ctag:hover b { color:var(--y); }
  .title { position:fixed; z-index:6; left:max(16px, env(safe-area-inset-left)); top:max(14px, env(safe-area-inset-top)); padding:10px 20px 9px; }
  .title h1 { margin:0; font-family:var(--f-pixel); font-weight:400; font-size:clamp(20px,2vw,28px); letter-spacing:4px; color:var(--y);
              text-shadow:0 0 14px rgba(232,200,119,.35), 0 2px 0 #3a2a10; line-height:1.3; }
  .title p { margin:2px 0 0; font-size:14px; color:var(--muted); font-family:var(--f-pixel); letter-spacing:1px; }
  .veil { position:fixed; inset:0; z-index:9; background:#070914; opacity:0; pointer-events:none; transition:opacity .5s ease-in .15s; }
  body.going #mapwrap { transform:scale(2.6); filter:blur(1.5px) brightness(1.2); }
  body.going .veil { opacity:1; }
  body.going .ctag, body.going .title { opacity:0; transition:opacity .2s; }
</style>
</head>
<body>
<div class="stage">
  <div id="mapwrap">
    <canvas id="cv" aria-hidden="true"></canvas>
    <canvas class="glow" id="glow-earth" aria-hidden="true"></canvas>
    <canvas class="glow" id="glow-ai" aria-hidden="true"></canvas>
    <button class="ctag win" id="tag-earth" aria-label="進入地球永續國（淨零碳）"><b>地球永續國</b><span class="pg">TERRA</span></button>
    <button class="ctag win" id="tag-ai" aria-label="進入 AI 智能國（AI 應用規劃師）"><b>AI 智能國</b><span class="pg">NOVA</span></button>
  </div>
</div>
<header class="title win"><h1>知識世界</h1><p>選一個國家開始冒險</p></header>
<div class="veil" aria-hidden="true"></div>
<script type="module" src="worldmap.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
